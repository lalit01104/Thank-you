<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#f3e2b8}
.stage{position:relative;width:100%;height:100vh;height:100svh;overflow:hidden;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#fff8df 0%,#f3dfad 48%,#c99a3b 100%)}
.spotlight{position:absolute;inset:0;background:radial-gradient(ellipse 45% 75% at 50% 50%,rgba(255,255,255,.55) 0%,rgba(255,248,220,.22) 35%,transparent 70%);opacity:0;animation:spotlightIn 1.5s ease forwards;animation-delay:2.5s;pointer-events:none}
@keyframes spotlightIn{to{opacity:1}}
.content{position:relative;z-index:2;width:90%;max-width:1200px;text-align:center;opacity:0;transform:scale(.75) translateY(25px);animation:revealText 1.4s cubic-bezier(.16,1,.3,1) forwards;animation-delay:2.2s}
.small-text{margin-bottom:15px;font-size:clamp(12px,1.2vw,18px);letter-spacing:.35em;text-transform:uppercase;color:rgba(91,61,18,.72)}
.thank-you{font-family:"Amsterdam Two","Brush Script MT","Segoe Script",cursive;font-size:clamp(65px,12vw,180px);line-height:.9;font-weight:700;letter-spacing:-.035em;color:#6f4a16;text-shadow:0 3px 0 rgba(255,255,255,.45),0 8px 25px rgba(91,61,18,.25)}
.underline{width:min(280px,45vw);height:2px;margin:28px auto 0;background:linear-gradient(90deg,transparent,#9b6b20,transparent);opacity:.7}
@keyframes revealText{0%{opacity:0;transform:scale(.75) translateY(25px)}60%{opacity:1}100%{opacity:1;transform:scale(1) translateY(0)}}
.curtain-container{position:absolute;inset:0;z-index:10;pointer-events:none}
.curtain{position:absolute;top:-5%;width:52%;height:110%;background:repeating-linear-gradient(90deg,#420000 0px,#720000 18px,#4d0000 35px,#260000 52px,#650000 70px);box-shadow:inset 0 0 80px rgba(0,0,0,.65),inset 0 0 25px rgba(255,255,255,.08)}
.curtain-left{left:0;transform-origin:left center;animation:openLeft 2.3s cubic-bezier(.77,0,.175,1) forwards}
.curtain-right{right:0;transform-origin:right center;animation:openRight 2.3s cubic-bezier(.77,0,.175,1) forwards}
@keyframes openLeft{0%{transform:translateX(0)}100%{transform:translateX(-105%)}}
@keyframes openRight{0%{transform:translateX(0)}100%{transform:translateX(105%)}}
.valance{position:absolute;top:0;left:0;width:100%;height:70px;z-index:11;background:repeating-linear-gradient(90deg,#280000 0px,#700000 25px,#3d0000 50px,#680000 75px);box-shadow:0 10px 30px rgba(0,0,0,.7);animation:valanceOpen 1.8s ease forwards;animation-delay:.2s}
@keyframes valanceOpen{0%{transform:translateY(0)}100%{transform:translateY(-110%)}}
.rod-left,.rod-right{position:absolute;top:0;width:6px;height:100%;background:linear-gradient(to bottom,#e5c66f,#9b6b20,#f0d98c);opacity:.85}
.rod-left{left:0}.rod-right{right:0}
.particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.particle{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(111,74,22,.35);opacity:0;animation:floatParticle linear infinite}
.particle:nth-child(1){left:15%;animation-duration:7s;animation-delay:3s}
.particle:nth-child(2){left:30%;animation-duration:9s;animation-delay:4s}
.particle:nth-child(3){left:50%;animation-duration:6s;animation-delay:3.5s}
.particle:nth-child(4){left:70%;animation-duration:8s;animation-delay:5s}
.particle:nth-child(5){left:85%;animation-duration:7s;animation-delay:4.5s}
@keyframes floatParticle{0%{bottom:-10px;opacity:0;transform:translateX(0)}20%{opacity:.5}80%{opacity:.3}100%{bottom:110%;opacity:0;transform:translateX(30px)}}
@media(max-width:600px){.curtain{width:56%}.thank-you{font-size:clamp(52px,17vw,100px);letter-spacing:-.06em}.small-text{font-size:10px;letter-spacing:.25em;margin-bottom:12px}.underline{margin-top:20px}.valance{height:48px}}
@media(max-height:500px){.thank-you{font-size:clamp(45px,13vw,100px)}.small-text{margin-bottom:8px}.underline{margin-top:15px}}
@media(prefers-reduced-motion:reduce){.curtain-left,.curtain-right,.valance,.content,.spotlight{animation:none}.curtain-left{transform:translateX(-105%)}.curtain-right{transform:translateX(105%)}.valance{transform:translateY(-110%)}.content,.spotlight{opacity:1}}
</style>
</head>
<body>
<main class="stage">
<div class="spotlight"></div>
<div class="particles">
<span class="particle"></span><span class="particle"></span><span class="particle"></span>
<span class="particle"></span><span class="particle"></span>
</div>
<section class="content">
<div class="small-text">With Gratitude</div>
<h1 class="thank-you">THANK YOU</h1>
<div class="underline"></div>
</section>
<div class="curtain-container">
<div class="curtain curtain-left"></div>
<div class="curtain curtain-right"></div>
<div class="valance"></div>
<div class="rod-left"></div>
<div class="rod-right"></div>
</div>
</main>
</body>
</html>
